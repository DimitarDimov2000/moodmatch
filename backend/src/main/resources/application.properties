quarkus.application.name=moodmatch-backend

quarkus.datasource.db-kind=postgresql
quarkus.hibernate-orm.schema-management.strategy=validate
quarkus.flyway.migrate-at-start=true
quarkus.flyway.validate-migration-naming=true
quarkus.oidc.enabled=false
quarkus.oidc.application-type=service
quarkus.oidc.auth-server-url=http://localhost/oidc-disabled
quarkus.oidc.client-id=moodmatch-local-disabled
quarkus.oidc.token.audience=moodmatch-local-disabled
quarkus.http.auth.permission.moodmatch-private.paths=/api/media,/api/media/*,/api/profile,/api/candidates,/api/matches,/api/external,/api/external/*
quarkus.http.auth.permission.moodmatch-private.policy=permit

moodmatch.auth.mode=${MOODMATCH_AUTH_MODE:local-password}
moodmatch.auth.token.ttl-hours=${MOODMATCH_AUTH_TOKEN_TTL_HOURS:24}
moodmatch.private-endpoint-policy=permit
moodmatch.auth.private-endpoint-policy=permit
moodmatch.auth.oidc.enabled=false
moodmatch.auth.oidc.provider=${MOODMATCH_OIDC_PROVIDER:OIDC}
moodmatch.external.tmdb.api-key=${MOODMATCH_TMDB_API_KEY:__missing_tmdb_config__}
moodmatch.external.tmdb.base-url=${MOODMATCH_TMDB_BASE_URL:https://api.themoviedb.org/3}
moodmatch.external.tmdb.image-base-url=${MOODMATCH_TMDB_IMAGE_BASE_URL:https://image.tmdb.org/t/p/w342}
moodmatch.external.tmdb.website-base-url=${MOODMATCH_TMDB_WEBSITE_BASE_URL:https://www.themoviedb.org}
moodmatch.external.podcast-index.key=${MOODMATCH_PODCASTINDEX_KEY:__missing_podcastindex_config__}
moodmatch.external.podcast-index.secret=${MOODMATCH_PODCASTINDEX_SECRET:__missing_podcastindex_config__}
moodmatch.external.podcast-index.base-url=${MOODMATCH_PODCASTINDEX_BASE_URL:https://api.podcastindex.org/api/1.0}
moodmatch.external.rawg.base-url=${MOODMATCH_RAWG_BASE_URL:https://api.rawg.io/api}
moodmatch.external.rawg.website-base-url=${MOODMATCH_RAWG_WEBSITE_BASE_URL:https://rawg.io}
moodmatch.external.anilist.base-url=${MOODMATCH_ANILIST_BASE_URL:https://graphql.anilist.co}
moodmatch.external.youtube.api-key=${MOODMATCH_YOUTUBE_API_KEY:__missing_youtube_config__}

%dev.quarkus.datasource.devservices.enabled=false
%dev.quarkus.datasource.jdbc.url=${MOODMATCH_DB_URL}
%dev.quarkus.datasource.username=${MOODMATCH_DB_USERNAME}
%dev.quarkus.datasource.password=${MOODMATCH_DB_PASSWORD}
%dev.moodmatch.auth.mode=${MOODMATCH_AUTH_MODE:local-password}
%dev.moodmatch.private-endpoint-policy=permit
%dev.moodmatch.auth.private-endpoint-policy=permit
%dev.moodmatch.auth.oidc.enabled=false

%test.quarkus.oidc.enabled=false
%test.quarkus.datasource.devservices.enabled=false
%test.quarkus.datasource.db-kind=h2
%test.quarkus.datasource.jdbc.url=jdbc:h2:mem:moodmatch;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
%test.quarkus.datasource.username=sa
%test.quarkus.datasource.password=sa
%test.moodmatch.auth.mode=local-demo
%test.moodmatch.private-endpoint-policy=demo
%test.moodmatch.auth.private-endpoint-policy=demo
%test.moodmatch.auth.oidc.enabled=false
%test.moodmatch.external.tmdb.api-key=__missing_tmdb_config__
%test.moodmatch.external.youtube.api-key=test-youtube-key

%dev.quarkus.log.category."com.moodmatch".level=DEBUG
%test.quarkus.log.category."com.moodmatch".level=DEBUG
