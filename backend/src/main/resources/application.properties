quarkus.application.name=moodmatch-backend

quarkus.datasource.db-kind=postgresql
quarkus.hibernate-orm.schema-management.strategy=validate
quarkus.flyway.migrate-at-start=true
quarkus.flyway.validate-migration-naming=true
quarkus.oidc.enabled=${moodmatch.auth.oidc.enabled}
quarkus.oidc.application-type=service
quarkus.oidc.auth-server-url=${MOODMATCH_OIDC_ISSUER_URL}
quarkus.oidc.client-id=${MOODMATCH_OIDC_CLIENT_ID}
quarkus.oidc.token.audience=${MOODMATCH_OIDC_AUDIENCE:${MOODMATCH_OIDC_CLIENT_ID}}
quarkus.http.auth.permission.moodmatch-private.paths=/api/media,/api/media/*,/api/profile,/api/candidates,/api/matches,/api/external/search
quarkus.http.auth.permission.moodmatch-private.policy=${moodmatch.auth.private-endpoint-policy}

moodmatch.auth.mode=${MOODMATCH_AUTH_MODE:oidc}
moodmatch.auth.private-endpoint-policy=${MOODMATCH_PRIVATE_ENDPOINT_POLICY:authenticated}
moodmatch.auth.oidc.enabled=${MOODMATCH_OIDC_ENABLED:true}
moodmatch.auth.oidc.provider=${MOODMATCH_OIDC_PROVIDER:OIDC}

%dev.quarkus.datasource.devservices.enabled=false
%dev.quarkus.datasource.jdbc.url=${MOODMATCH_DB_URL}
%dev.quarkus.datasource.username=${MOODMATCH_DB_USERNAME}
%dev.quarkus.datasource.password=${MOODMATCH_DB_PASSWORD}
%dev.moodmatch.auth.mode=${MOODMATCH_AUTH_MODE:local-demo}
%dev.moodmatch.auth.private-endpoint-policy=${MOODMATCH_PRIVATE_ENDPOINT_POLICY:permit}
%dev.moodmatch.auth.oidc.enabled=${MOODMATCH_OIDC_ENABLED:false}

%test.quarkus.datasource.devservices.enabled=false
%test.quarkus.datasource.db-kind=h2
%test.quarkus.datasource.jdbc.url=jdbc:h2:mem:moodmatch;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
%test.quarkus.datasource.username=sa
%test.quarkus.datasource.password=sa
%test.moodmatch.auth.mode=${MOODMATCH_AUTH_MODE:local-demo}
%test.moodmatch.auth.private-endpoint-policy=${MOODMATCH_PRIVATE_ENDPOINT_POLICY:permit}
%test.moodmatch.auth.oidc.enabled=${MOODMATCH_OIDC_ENABLED:false}

%dev.quarkus.log.category."com.moodmatch".level=DEBUG
%test.quarkus.log.category."com.moodmatch".level=DEBUG
